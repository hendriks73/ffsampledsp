repos:
  - repo: local
    hooks:
      - id: spotless
        name: spotless
        language: system
        entry: mvn --batch-mode spotless:apply
        pass_filenames: false
        files: \.(java|yaml|yml|html|css|xml)$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.0
    hooks:
      - id: clang-format
        types_or: [c, c++, objective-c]
        files: \.(c|h|cpp|cc|cxx|m|mm)$
